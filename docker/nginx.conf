# Only production may be indexed
map "${APP_ENV}" $robots_tag {
    production "all";
    default "noindex, nofollow";
}

# Hashed assets never change, everything else is revalidated
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

# One site on the unprivileged port
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # File types, plus the one of the web manifest
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Compresses text on the fly
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;

    # The Content Security Policy ships in index.html
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

    # Answers the health checks of Docker and the CI
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Staging and development keep every crawler out
    location = /robots.txt {
        default_type text/plain;
        if ($robots_tag != "all") {
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }

    # The app answers every other address, like GitHub Pages
    location / {
        try_files $uri $uri/ /index.html;
    }
}
