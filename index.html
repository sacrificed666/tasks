<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tasks · Private task planner</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="author" content="Illia Movchko" />
    <meta name="application-name" content="Tasks" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8edf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a14" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tasks" />
    <meta property="og:title" content="Tasks" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tasks with smart lists, projects, a task list and the overview" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:locale:alternate" content="nl_NL" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Tasks with smart lists, projects, a task list and the overview" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tasks",
        "url": "%SITE_URL%",
        "description": "%APP_DESCRIPTION%",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "inLanguage": ["en", "uk", "cs", "de", "es", "fr", "it", "nl", "pl", "pt"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "%SITE_URL%og-image.jpg",
        "screenshot": "%SITE_URL%screenshots/wide.jpg",
        "featureList": [
          "Projects with colours and emoji icons",
          "Tags that can be picked, typed with # and searched",
          "Smart lists for today, upcoming, important and completed tasks",
          "Repeating tasks",
          "Calendar and natural language quick add",
          "Offline support",
          "Swipes between lists on phones",
          "Ten languages"
        ],
        "author": { "@type": "Person", "name": "Illia Movchko", "url": "https://github.com/sacrificed666" },
        "license": "https://choosealicense.com/licenses/mit/"
      }
    </script>
  </head>
  <body>
    <noscript>
      <h1>Tasks</h1>
      <p>
        Tasks is a free, private task planner with projects, tags, smart lists, repeating tasks and a calendar. It works
        offline in ten languages and keeps your tasks on your device. Please turn on JavaScript to use it.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
